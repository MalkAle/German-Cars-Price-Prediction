AWSTemplateFormatVersion: '2010-09-09'
Description: >
  App Runner infrastructure for the German Cars Price Prediction App.
  Creates the S3 model artifacts bucket, ECR access role, App Runner instance
  role, auto-scaling config, and the App Runner service.

  Deploy:
    aws cloudformation deploy \
      --region eu-central-1 \
      --template-file infra/apprunner.yaml \
      --stack-name german-cars-app \
      --capabilities CAPABILITY_NAMED_IAM

  Tear down:
    aws cloudformation delete-stack \
      --region eu-central-1 \
      --stack-name german-cars-app

Parameters:
  ECRImageUri:
    Type: String
    Default: 339713185538.dkr.ecr.eu-central-1.amazonaws.com/german_cars_app:latest
    Description: Full ECR image URI including tag

  AppPort:
    Type: String
    Default: '8501'
    Description: Port the Streamlit app listens on

  Cpu:
    Type: String
    Default: '0.5 vCPU'
    AllowedValues: ['0.25 vCPU', '0.5 vCPU', '1 vCPU']
    Description: App Runner instance CPU

  Memory:
    Type: String
    Default: '1 GB'
    AllowedValues: ['0.5 GB', '1 GB', '2 GB']
    Description: App Runner instance memory

  GithubActionsRoleName:
    Type: String
    Default: Github-role
    Description: Name of the existing IAM role used by GitHub Actions

Resources:

  # Private S3 bucket that holds per-model ML artifacts
  ModelArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Allows App Runner to pull images from ECR (build-time, not runtime)
  ECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AppRunnerECRAccessRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # Allows the running container to read model artifacts from S3 (runtime)
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AppRunnerInstanceRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ReadModelArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ModelArtifactsBucket.Arn
                  - !Sub '${ModelArtifactsBucket.Arn}/*'

  # Keeps at least 1 instance warm to eliminate cold starts
  AutoScalingConfig:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: german-cars-asc
      MinSize: 1
      MaxSize: 5
      MaxConcurrency: 100

  # The App Runner service
  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: german_cars_app
      AutoScalingConfigurationArn: !GetAtt AutoScalingConfig.AutoScalingConfigurationArn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /_stcore/health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt ECRAccessRole.Arn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ECRImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: !Ref AppPort
            RuntimeEnvironmentVariables:
              - Name: S3_BUCKET
                Value: !Ref ModelArtifactsBucket
      InstanceConfiguration:
        Cpu: !Ref Cpu
        Memory: !Ref Memory
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn

  # Grants the GitHub Actions role permission to trigger App Runner deploys
  GithubActionsDeployPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AppRunnerDeploy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: apprunner:StartDeployment
            Resource: !GetAtt AppRunnerService.ServiceArn
      Roles:
        - !Ref GithubActionsRoleName

Outputs:
  ServiceUrl:
    Value: !GetAtt AppRunnerService.ServiceUrl
    Description: App Runner service URL (HTTPS)

  ServiceArn:
    Value: !GetAtt AppRunnerService.ServiceArn
    Description: App Runner service ARN — add this as APP_RUNNER_SERVICE_ARN in GitHub secrets

  ModelArtifactsBucketName:
    Value: !Ref ModelArtifactsBucket
    Description: S3 bucket for model artifacts — needed when running ger_cars_model.py
